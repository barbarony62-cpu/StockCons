name: Build AskCons V0.8.0 Installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify read-only contract
        shell: pwsh
        run: |
          python tools/verify_readonly.py
          python tools/verify_window_resources.py
      - name: Run synthetic financial and conversation regression checks
        run: dotnet run --project tests/AskCons.Tests.csproj -c Release
      - name: Publish Windows x64
        run: dotnet publish AskCons.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: AskCons-Installer-0.8.0
          path: installer-output/AskCons-Setup-0.8.0.exe
          retention-days: 3


